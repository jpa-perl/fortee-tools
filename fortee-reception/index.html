<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- 安全領域（env(safe-area-inset-*)）を使うので viewport-fit=cover にする（Design Doc 6.12） -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- ライトモードに固定する（画面設計書 1.2） -->
    <meta name="color-scheme" content="only light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- title、ホーム画面の名前、Service Worker のキャッシュ名は、ビルドが埋め込む（build/app-shell.ts） -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
